header{background:#3d4043;color:#fff;padding:14px 16px;border-bottom:4px solid #F47920;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}

.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid #ccc}
.done{text-align:center;padding:40px 10px}
.done .tick{font-size:54px;color:#1a7f37}

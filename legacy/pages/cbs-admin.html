function sameCo(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();}
var _rt=rowTitle;rowTitle=function(t,r){
if(t==='rams')return r.activity||r.task||'RAMS';
if(t==='subbies')return r.company||'Subcontractor';
if(t==='subdocs')return (r.company||'')+' - '+(r.custom_name||r.item||'');
if(t==='insurance')return r.custom_name||r.item||'Policy';
if(t==='vehicles')return (r.reg||'')+' '+(r.make_model||'');
if(t==='checks')return (r.vehicle||'')+' check';
if(t==='crashes')return (r.vehicle||'')+' - '+(r.driver||'');
return _rt(t,r);};
var _rm=rowMeta;rowMeta=function(t,r){
if(t==='rams')return (r.site||'')+' | Rev '+(r.revision||'0');
if(t==='subbies')return (r.trade||'')+(r.contact?' | '+r.contact:'')+(r.mobile?' | '+r.mobile:'');
if(t==='subdocs')return (r.reference?r.reference+' | ':'')+(r.expires_on?'expires '+nzDate(r.expires_on):'no expiry');
if(t==='insurance')return (r.insurer||'')+(r.policy_no?' | '+r.policy_no:'')+(r.expires_on?' | expires '+nzDate(r.expires_on):'');
if(t==='vehicles')return (r.assigned_to?r.assigned_to+' | ':'')+'Tax '+(r.tax_due?nzDate(r.tax_due):'-')+' | MOT '+(r.mot_expiry?nzDate(r.mot_expiry):'-');
if(t==='checks')return nzDate(r.checked_on)+(r.checked_by?' | '+r.checked_by:'')+(r.odometer?' | '+r.odometer+' miles':'');
if(t==='crashes')return nzDate(r.occurred_at)+(r.location?' | '+r.location:'');
return _rm(t,r);};
function expTag(d){
if(d===null)return "<span class='tag t-mut'>No date</span>";
if(d<0)return "<span class='tag t-bad'>Expired</span>";
if(d<60)return "<span class='tag t-warn'>"+d+" days left</span>";
return "<span class='tag t-ok'>Current</span>";}
var _rg=rowTags;rowTags=function(t,r){
if(t==='rams')return "<span class='tag "+(r.status==='Issued'?'t-ok':'t-mut')+"'>"+esc(r.status||'Draft')+"</span>";
if(t==='subbies'){
var h=r.approved===true?"<span class='tag t-ok'>Approved</span>":"<span class='tag t-warn'>Not approved</span>";
var mine=(DATA.subdocs||[]).filter(function(x){return sameCo(x.company,r.company)});
h+="<span class='tag t-mut'>"+mine.length+" document(s)</span>";
var bad=mine.filter(function(x){var d=days(x.expires_on);return d!==null&&d<0}).length;
if(bad)h+="<span class='tag t-bad'>"+bad+" expired</span>";return h;}
if(t==='subdocs'||t==='insurance')return expTag(days(r.expires_on));
if(t==='vehicles'){var h='';var dr=days(r.tax_due),dw=days(r.mot_expiry);
if(dr!==null&&dr<30)h+="<span class='tag "+(dr<0?'t-bad':'t-warn')+"'>Tax "+(dr<0?'expired':dr+' days')+"</span>";
if(dw!==null&&dw<30)h+="<span class='tag "+(dw<0?'t-bad':'t-warn')+"'>MOT "+(dw<0?'expired':dw+' days')+"</span>";
if(!h)h="<span class='tag t-ok'>Current</span>";return h;}
if(t==='checks')return "<span class='tag "+(r.status==='Passed'?'t-ok':(r.status==='Off road'?'t-bad':'t-warn'))+"'>"+esc(r.status||'')+"</span>";
if(t==='crashes')return "<span class='tag "+(r.status==='Closed'?'t-ok':'t-warn')+"'>"+esc(r.status||'Reported')+"</span>";
return _rg(t,r);};

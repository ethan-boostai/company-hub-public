var STD=[{"k": "about", "t": "About this plan", "x": "This plan is structured as recommended by HSE guidance on the construction phase plan (CDM 2015) and covers the duties placed on Chelmsford Building Services Ltd (CBS) when appointed as Principal Contractor under the Construction (Design and Management) Regulations 2015.\nAll relevant legislation is referred to and covered in the CBS Health, Safety and Welfare Manual, supplied as a separate document.\nThis plan is based on CBS's own site survey work to date and the pre-construction information provided by the client. Where specific methods cannot be fixed before work starts, the approach is described here and confirmed in the RAMS. The plan is reviewed and reissued as the work progresses, when the scope or methods change, or when the client, Principal Designer or any contractor raises a change. Comments from everyone involved are welcome and changes are communicated to those affected."}, {"k": "principles", "t": "Health and safety principles and objectives", "x": "Our health and safety principles and objectives for this project are to:\n- achieve no accidents, no harm to people and no damage to the environment\n- meet the client's health, safety and environmental requirements as they relate to this project, including those set by the client's authorised agents\n- plan every activity carried out by CBS, our subcontractors and anyone else employed on the project in line with best practice\n- eliminate hazards, or reduce the risks so far as is reasonably practicable, for everyone working on the project and everyone who could be affected by it."}, {"k": "pc_design", "t": "Principal Contractor's actions", "x": "The Principal Contractor will make sure that:\n- the residual risks are communicated to all operatives at induction and in the RAMS\n- method statements address every identified risk\n- the work is coordinated with the client, the Principal Designer and any following trades."}, {"k": "noise", "t": "Noise and vibration", "x": "Noise and vibration are kept as low as reasonably practicable. Noisy work is planned with the client and restricted to agreed hours to keep disruption to building occupants and neighbours to a minimum. Where needed, noise assessments are carried out under the Control of Noise at Work Regulations 2005 and the results used to set controls. Powered tools are selected and used to limit exposure under the Control of Vibration at Work Regulations 2005. Operatives use hearing, eye, face and respiratory protection where the RAMS require it.\nAny alternative working arrangements are agreed with the site manager in consultation with the client and, where necessary, the local authority."}, {"k": "lighting", "t": "Temporary lighting", "x": "Temporary lighting is used where light levels fall below a safe working level for operatives and others authorised to enter the works area. Warning notices are put up around the works area to prevent entry by unauthorised people."}, {"k": "parking", "t": "Parking", "x": "All parking restrictions on and around the client's premises are observed. Vehicles must not be parked where they would cause danger or obstruction to people, delivery vehicles or emergency routes. Access is kept clear for waste collection."}, {"k": "skips", "t": "Skips and waste containers", "x": "Skips and waste containers are only positioned with the site manager's agreement and the client's permission. Unplanned vehicles may be turned away. A trained banksman supervises waste transfer to the skip. Access for client staff is never obstructed, and full skips are removed promptly by a registered waste carrier."}, {"k": "deliveries", "t": "Deliveries and movements on and off site", "x": "Deliveries and vehicle movements are timed outside the client's peak traffic periods, agreed daily with the client according to their activities and local conditions."}, {"k": "security", "t": "Security out of hours", "x": "The site manager makes sure all work areas are secured against entry by client staff and others when work is not in progress, using hoardings, barriers and signage. This is especially important where the client's site operates around the clock."}, {"k": "asbestos", "t": "Asbestos", "x": "If any material suspected of containing asbestos is found, work in that area stops immediately and it is reported to the site manager and the client's project manager. Work does not resume until the client's project manager confirms it is safe.\nAsbestos forming part of the building fabric is only handled, removed and transported by a suitably licensed or competent specialist contractor engaged by the client, in line with the Control of Asbestos Regulations 2012. If in doubt, contact the site manager."}, {"k": "lead", "t": "Lead", "x": "If lead is found and needs to be worked, the work is only carried out by trained and competent operatives, in a segregated area, with the PPE CBS provides (gloves, overalls, eye protection and suitable respiratory protection) and good hygiene (no eating, drinking or smoking in the area, washing before breaks). The requirements of the Control of Lead at Work Regulations 2002 are followed at all times. If in doubt, contact the site manager."}, {"k": "dust", "t": "Dust", "x": "Dust may be created when removing and installing materials, fixings and sealants, and from dirt on existing surfaces. Controls include:\n- careful removal of materials to minimise disturbance and dust\n- avoiding unnecessary breaking or cutting, and using on-tool extraction or water suppression where cutting is needed\n- controlled lowering of materials so debris does not spread\n- good housekeeping and regular removal of waste\n- segregating the work area and controlling access.\nLight damping down may be used where it is safe, taking account of slip risks. Where risk remains, operatives wear suitable face-fit tested respiratory protective equipment (RPE). All controls follow CDM 2015, COSHH and HSE guidance."}, {"k": "lepto", "t": "Leptospirosis (Weil's disease)", "x": "Leptospirosis can be caught through contact with the urine of infected rats, usually through cuts or the eyes. Cover cuts and grazes before work, wear gloves when handling materials that may be contaminated, and wash your hands before eating, drinking or smoking. If you think rat urine or contaminated material has got into a cut, clean it with the first aid kit and report it to the site manager straight away. If you develop flu-like symptoms after possible exposure, see a doctor and tell them you may have been exposed."}, {"k": "waste", "t": "Waste", "x": "All waste is disposed of in line with the Environmental Protection Act 1990 and the waste duty of care. Only registered waste carriers and permitted sites are used. Waste transfer notes (and consignment notes for hazardous waste) are kept and copies passed to the client's project manager on request. Waste containers are secured or lockable to prevent fly-tipping of other materials into them."}, {"k": "compound", "t": "Contractor's compound and storage", "x": "Any compound is secured with lockable fencing and gates. Where the work area sits next to a live yard, equipment and materials are stored within protected areas only. Nothing is left on site when the area is handed back to the client."}, {"k": "signs", "t": "Signs and notices", "x": "Safety signs comply with the Health and Safety (Safety Signs and Signals) Regulations 1996 and BS ISO 7010. Signs are put up to direct traffic and pedestrians, warn of hazards and identify site facilities. Where the project is notifiable, the F10 notification is displayed as required by CDM 2015."}, {"k": "coshh", "t": "Hazardous substances (CoSHH)", "x": "Use of hazardous substances is kept to a minimum, with less hazardous alternatives used where reasonably practicable. A CoSHH assessment and the manufacturer's Safety Data Sheet (SDS) are held for every substance and explained to the people who use it. Substances are stored in a locked, segregated container under the site manager's control and disposed of as the SDS and the local authority require. Suppliers and subcontractors must provide SDSs and CoSHH assessments for substances they bring to site."}, {"k": "manual", "t": "Manual handling", "x": "Manual handling is avoided where reasonably practicable by using mechanical aids. Loads of 25 kg or more are not moved by one person without a risk assessment under the Manual Handling Operations Regulations 1992. Long or awkward items such as sheets are moved as a team lift or mechanically."}, {"k": "sharps", "t": "Needles and sharps", "x": "If a needle or syringe is found, do not touch it. Make the area safe, stop work in that area and report it to the site manager and the client's facilities manager. Work resumes when the client confirms it is safe."}, {"k": "plant", "t": "Plant and equipment", "x": "All plant and equipment is maintained, inspected and used in line with PUWER 1998, and lifting equipment with LOLER 1998 (thorough examination certificates held). MEWP and telehandler operators hold current IPAF or CPCS/NPORS cards. Portable electrical equipment is inspected and tested, and 110 V or battery tools are used on site. Subcontractors bringing plant must provide inspection records and operator training records. Copies are kept in the site file."}, {"k": "permits", "t": "Permits to work", "x": "CBS operates a permit to work system for high-risk activities, managed and monitored by the site manager or his deputy. CBS permits take priority as Principal Contractor. Hot works are not planned; if they become necessary, a hot works permit is issued only with the client's facilities manager's approval, with a fire watch kept during and for at least 60 minutes after the work."}, {"k": "site_mgmt", "t": "Works and site management", "x": "The site manager has overall responsibility for the works through to completion. Policy decisions and anything affecting cost are referred to him.\nFollowing weekly site meetings and daily liaison with the client, contractors and others, the site manager is responsible for:\n- identifying hazards on the project\n- recording risk assessments and method statements and making them known to everyone concerned\n- developing and putting in place corrective and preventive actions when methods change or no longer apply.\nThe site manager or his deputy is responsible day to day for supervising all site labour, controlling access of vehicles, plant, materials and visitors, and supervising all work methods, plant, equipment and tools. All queries about the works go to the site manager."}, {"k": "standards", "t": "Standard setting", "x": "This project is carried out throughout under the Construction (Design and Management) Regulations 2015. CDM does not replace other legislation; the following also apply:\n- Health and Safety at Work etc. Act 1974\n- Management of Health and Safety at Work Regulations 1999\n- Work at Height Regulations 2005\n- Manual Handling Operations Regulations 1992\n- Provision and Use of Work Equipment Regulations 1998\n- Lifting Operations and Lifting Equipment Regulations 1998\n- Control of Substances Hazardous to Health Regulations 2002\n- Control of Asbestos Regulations 2012\n- Control of Noise at Work Regulations 2005 and Control of Vibration at Work Regulations 2005\n- Personal Protective Equipment at Work Regulations 1992 (as amended 2022)\n- Reporting of Injuries, Diseases and Dangerous Occurrences Regulations 2013 (RIDDOR)\n- Workplace (Health, Safety and Welfare) Regulations 1992.\nThe client's health, safety and environmental standards also apply at all times, and all contractors must follow the client's instructions as issued."}, {"k": "info", "t": "Information for contractors", "x": "Essential health and safety information is explained to each contractor's supervisor, verbally and in writing as appropriate, before or on joining site, and updated as the need arises. All relevant information is kept in the site file, available to everyone on site. Subcontractors, client personnel and the client's agents pass relevant information to the site manager, who records it in the site file and passes it on promptly to the contractors concerned."}, {"k": "selection", "t": "Selection of contractors, suppliers and designers", "x": "Self-employed people working directly for CBS are supervised and managed in the same way as CBS employees and must hold the same level of competence.\nSubcontractors complete CBS's pre-qualification questionnaire and provide evidence of insurance, their health and safety policy and arrangements, accident history, training and competence (including CSCS or equivalent cards), example safe systems of work, the workers and supervisors they will use, and any HSE notices received in the last three years. Approved subcontractors are recorded in the CBS Subcontractors and Suppliers register.\nSuppliers must provide Safety Data Sheets for every hazardous substance supplied. Designers appointed by CBS are selected on the same basis and must comply with their duties under CDM 2015."}, {"k": "comms", "t": "Communication, cooperation and coordination", "x": "As Principal Contractor, CBS issues, collects, records and coordinates health and safety information between the client, Principal Designer, designers, contractors, workers and visitors throughout the project. Everyone involved is expected to communicate and coordinate through CBS.\nBefore starting work, everyone on site is made aware of this plan, the information relevant to them, and the other contractors they need to coordinate with. If in doubt about anything, check with the site manager or his deputy before acting.\nAll operatives sign to confirm they understand and will comply with CBS's and the client's site rules. Everyone signs in and out with the site manager or his deputy."}, {"k": "rams", "t": "Activities with risks to health and safety", "x": "The site manager makes sure RAMS are prepared for every activity with significant risk. Where the pre-construction information identifies hazards, CBS's risk assessments include the designers' risk information and any further activities and risks identified. Controls protect everyone who may be affected, including visitors and members of the public. Subcontractors provide their own RAMS for review and approval before starting. The current RAMS are listed in Appendix 2."}, {"k": "injuries", "t": "Accidents and first aid", "x": "CBS provides a first aid kit and keeps an accident record on site throughout the project for everyone on site, including visitors. All accidents, however minor, are reported to the site manager or his deputy, who arranges first aid and decides on further action.\nInjuries needing more than first aid are taken to the client's first aid or occupational health service during their hours, or otherwise to the nearest A&E. Call 999 for an ambulance for anything serious, and tell site security that an ambulance is coming."}, {"k": "reporting", "t": "Reporting accidents, incidents and RIDDOR", "x": "Everyone must report every accident, incident and near miss to the site manager or his deputy straight away. The site manager records it in the CBS team app, reports it to the client in line with the client's site rules, and arranges the investigation.\nThe site manager makes sure reportable events are reported to HSE under RIDDOR 2013: deaths and specified injuries without delay, over-7-day injuries within 15 days, dangerous occurrences, and reportable occupational diseases. Report online at www.hse.gov.uk/riddor, or for fatal and specified injuries only, by phone to the HSE Incident Contact Centre on 0345 300 9923."}, {"k": "induction", "t": "Information, induction and training", "x": "Nobody starts work on site until they have been inducted by the site manager or his deputy. The induction covers this plan, the site hazards and controls, emergency arrangements and the assembly point, first aid, welfare, site rules, PPE, reporting, and the RAMS for their work. Each person signs the induction record.\nToolbox talks are given at suitable times throughout the contract. Operatives must hold the cards and qualifications needed for their work, and statutory notices are displayed on site."}, {"k": "consultation", "t": "Consultation with workers", "x": "Consultation is part of the communication and cooperation process. Workers are consulted on matters affecting their health and safety through inductions, daily briefings, toolbox talks and the CBS team app, where anyone can raise a hazard, near miss or concern. Every worker has the right to stop work they believe is unsafe and raise it with the site manager."}, {"k": "rules", "t": "Site rules", "x": "Site rules for this project are:\n- the client's site rules, codes of conduct and instructions, which everyone must read, understand and follow\n- CBS's rules as set out in the Health, Safety and Welfare Manual\n- any instructions given by the site manager or his deputy during the project."}, {"k": "hsfile", "t": "Health and safety file", "x": "CBS keeps a site health and safety file throughout the project and passes all relevant information to the Principal Designer for the final health and safety file, in the format agreed with the Principal Designer and the client. Where the Principal Designer's appointment ends before the project does, CBS completes the file and hands it to the client."}, {"k": "monitoring", "t": "Arrangements for monitoring", "x": "Communication, cooperation and coordination are monitored as described in section 2.6. The site manager carries out a recorded site inspection at least weekly; deficiencies and remedial actions are recorded and followed up to agreed timescales. Compliance with CBS and client site rules is maintained through supervision, observation and, where needed, CBS's disciplinary procedures. The site manager maintains the site file throughout."}, {"k": "documents", "t": "Supporting documents", "x": "The CBS Health, Safety and Welfare Manual contains the safe working practices CBS expects all contractors on site to follow. CBS also holds generic risk assessments for equipment and common activities in the site file. If you think anything in this plan or the RAMS should be added or changed, tell the site manager as a matter of urgency. This plan is updated and reissued when that happens."}, {"k": "fire", "t": "Fire precautions", "x": "The site manager is the fire warden for the site, with his deputy nominated so there is always a supervisor and fire warden present while CBS has people on site. Only competent, authorised people enter areas with fire risks. Emergency routes are kept clear at all times.\nEveryone is shown at induction where the fire points, alarm call points, extinguishers and assembly point are. The client's fire and emergency plan, escape routes and assembly points are displayed on the site notice board and must be followed.\nIf you discover a fire: raise the alarm using the nearest fire alarm call point (or by shouting \"Fire!\" where there is no alarm), call 999, and evacuate by the nearest safe exit to the assembly point. Only tackle a small fire if you are trained, it is safe and you have a clear escape route. Do not go back in until told it is safe.\nExtinguishers (BS EN 3, red body with a coloured band):\n- Water (red): wood, paper, textiles. Never on electrical fires.\n- Foam (cream): as water, plus flammable liquids.\n- Dry powder (blue): flammable liquids and gases, electrical equipment. Avoid in confined spaces.\n- CO2 (black): electrical equipment and flammable liquids. Do not hold the horn.\n- Wet chemical (yellow): cooking oil fires.\nFor electrical fires, isolate the power first if it is safe to do so."}, {"k": "acceptance", "t": "Operatives' acceptance", "x": "By signing, I confirm that I have read, discussed with management and understood the method statements and risk assessments that apply to the work I am carrying out on this project, and this construction phase plan. I agree to follow the restrictions and control methods that apply to the way the work is to be carried out."}, {"k": "policy", "t": "Company health and safety policy statement", "x": "Chelmsford Building Services is committed to making sure everyone who works on or visits our sites goes home safe and well, and to meeting our duties under the Health and Safety at Work etc. Act 1974 and CDM 2015. The current signed policy statement and the Health, Safety and Welfare Manual are held in the site file."}];
var EMG=[{"k": "general", "t": "General emergency response", "x": "1. Stop work and make your area safe if it is safe to do so.\n2. Raise the alarm and tell the site manager.\n3. Call 999 if there is any threat to life.\n4. Follow the client's emergency procedure and evacuate to the assembly point by the safest route. Do not go back for belongings.\n5. The site manager checks everyone is accounted for using the sign-in record and meets the emergency services.\n6. Nobody returns until the site manager, the client or the emergency services say it is safe."}, {"k": "notify", "t": "Notification process", "x": "1. The person who finds the emergency raises the alarm and tells the site manager.\n2. The site manager calls 999 if needed and takes charge.\n3. The site manager tells the client's project manager and site security as soon as the scene is under control.\n4. The site manager tells a CBS director, and decides with them whether the event is reportable under RIDDOR.\n5. Where appropriate, the injured person's emergency contact is told.\n6. The event is recorded in the CBS team app the same day."}, {"k": "actions", "t": "Immediate emergency actions", "x": "Immediate actions for common emergencies:"}, {"k": "height", "t": "Fall or rescue from height", "x": "Call 999 for anyone who has fallen or is suspended in a harness or safety net. Rescue them as quickly as possible using the rescue plan in this plan and the RAMS (suspension trauma can develop within minutes). Do not move a fallen person unless they are in further danger. Give first aid and keep them warm until help arrives."}, {"k": "medical", "t": "Serious injury or medical emergency", "x": "Call 999. Send someone to meet the ambulance at the gate. The first aider gives first aid within their training. For an unresponsive person who is not breathing normally, start CPR and send for the nearest defibrillator (AED). Preserve the scene if the injury may be reportable under RIDDOR."}, {"k": "cpr", "t": "Resuscitation (DRABC)", "x": "D - Danger: check for danger to yourself, others and the casualty.\nR - Response: talk to them and gently tap their shoulders. If there is no response, shout for help.\nA - Airway: tilt the head back and lift the chin to open the airway.\nB - Breathing: look, listen and feel for normal breathing for up to 10 seconds. If they are breathing normally, put them in the recovery position and monitor them.\nC - CPR: if they are not breathing normally, call 999 (put the phone on speaker) and send for an AED. Give 30 chest compressions (centre of the chest, 5 to 6 cm deep, 100 to 120 a minute) then 2 rescue breaths if trained and willing, otherwise continuous compressions. Attach the AED as soon as it arrives and follow its prompts."}, {"k": "firstaid", "t": "First aid injury", "x": "1. Make the area safe.\n2. The first aider treats the injury within their training, wearing gloves.\n3. Bleeding: firm direct pressure with a clean dressing. Burns: cool under cool running water for 20 minutes. Eyes: flush with clean water or eyewash and do not rub.\n4. For non-urgent medical advice call NHS 111. For anything serious call 999.\n5. Record the injury in the CBS team app and restock the first aid kit."}, {"k": "hospital", "t": "Injury needing a hospital", "x": "Call 999 for anything serious. Do not drive a seriously injured person yourself. For less serious injuries, a supervisor or co-worker takes the person to the nearest A&E listed in this plan; the injured person must not drive. The site manager tells the client and a CBS director and checks whether it is reportable under RIDDOR."}, {"k": "vehicle", "t": "Vehicle accident", "x": "Make the area safe, call 999 if anyone is hurt, give first aid and do not move injured people unless they are in danger. Report it to the site manager and the client, and record it in the CBS team app."}, {"k": "spill", "t": "Environmental spill", "x": "Stop the source if it is safe. Contain the spill with the spill kit and stop it reaching drains or watercourses. Follow the SDS for clean-up and PPE. Report it to the site manager and the client straight away. Pollution of drains or watercourses is reported to the Environment Agency incident hotline on 0800 80 70 60."}, {"k": "services", "t": "Gas leak or electrical contact", "x": "Gas: stop work, no ignition sources, evacuate and call the National Gas Emergency Service on 0800 111 999 (and 999 if there is a fire or injury). Electrical contact: do not touch the person until the power is isolated, call 999 and start CPR if needed. Report any damage to services to the client."}, {"k": "weather", "t": "Severe weather", "x": "The site manager monitors forecasts and wind speed. Stop roof and height work in high winds (above 23 mph or as set in the RAMS), lightning, ice or heavy rain. Secure materials and sheets, and check edge protection, netting and scaffolds after severe weather before work resumes."}];

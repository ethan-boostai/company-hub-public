var TOPICS_V1=[{"id": "roofs", "t": "Roof work, fragile surfaces and edge protection", "p": ["Any fall from height can kill. Roof access is planned and set out in the RAMS before anyone goes up.", "Check the edge protection, netting and access points are in place and inspected before you start.", "Treat every rooflight and any unknown roof sheet as fragile. Never step on them; use crawling boards or stay on the designated walkways.", "Remove sheets in small, controlled sections so the roof stays stable, and report any damaged purlins or fixings straight away.", "Keep an exclusion zone below the work and tether tools so nothing falls on people below.", "Stop work in high wind (above 23 mph), rain, ice or poor light. Nobody works on a roof alone."]}, {"id": "ladders", "t": "Ladders and stepladders", "p": ["Use ladders only for short-duration, light work (minutes, not hours) where a platform or MEWP isn't practicable.", "Do a pre-use check: feet, rungs, stiles and locks. Use Class 1 or EN 131 professional ladders only.", "Set leaning ladders at about 1 out for every 4 up, on firm level ground, extending 1 m above the landing point.", "Tie the ladder or have it footed. Keep three points of contact and don't overreach.", "Don't carry heavy or awkward items up a ladder. Use a hoist or lifting equipment."]}, {"id": "mewp", "t": "MEWPs and telehandlers", "p": ["Only trained, carded operators (IPAF or CPCS/NPORS) may operate a MEWP or telehandler.", "Do the pre-use check and check the thorough examination (LOLER) is in date.", "Check the ground conditions, overhead hazards and the exclusion zone before setting up.", "Wear a harness with a short restraint lanyard in boom-type MEWPs, clipped to the designated anchor.", "A trained ground rescue person stays at ground level while the MEWP is in use and knows how to use the ground controls.", "A banksman controls every telehandler movement near people or in the client's yard."]}, {"id": "dust", "t": "Dust and silica", "p": ["Cutting, drilling and grinding concrete, brick, block or stone creates silica dust, which causes lung disease.", "Use on-tool extraction (M or H class) or water suppression every time.", "Wear face-fit tested RPE (FFP3 as a minimum for silica). Be clean-shaven where the mask seals.", "Never dry sweep or blow dust with compressed air. Use an H-class vacuum.", "Keep the client's areas, especially food production areas, sealed off from dust."]}, {"id": "asbestos", "t": "Asbestos awareness", "p": ["Buildings built or refurbished before 2000 may contain asbestos: roof sheets, cladding, insulation board, pipe lagging, textured coatings and floor tiles.", "Check the client's asbestos survey before work starts and ask the site manager if you are unsure.", "If you find something you suspect is asbestos: stop, do not disturb it, keep others away and tell the site manager.", "Only a licensed or competent specialist removes asbestos. Breathing in the fibres causes fatal diseases years later."]}, {"id": "hotworks", "t": "Hot works and fire risk", "p": ["Grinding, cutting and welding throw sparks that can start fires hours later.", "Hot works only go ahead under a CBS hot works permit, with the client's approval where required.", "Clear or protect combustibles, check what is behind and below the work, and keep a suitable extinguisher at hand.", "Keep a fire watch during the work and for at least 60 minutes afterwards, then check the area again before leaving."]}, {"id": "livesite", "t": "Working on live client sites and food factories", "p": ["We work in live premises. Follow the client's site rules, sign in and out, and stay within the segregated work area.", "Food sites: no food, drink, glass or loose items in production areas, follow the client's hygiene and PPE rules, and report any foreign body risk.", "Keep barriers, signage and segregation in place at all times. Never use the client's equipment without permission.", "Keep vehicle movements to agreed times and routes, with a banksman in the client's yard.", "Leave nothing behind: no debris, fixings, packaging or tools at height or on the client's premises at the end of the shift."]}, {"id": "lifting", "t": "Manual handling", "p": ["Avoid manual handling where you can by using the telehandler, trolleys or other aids.", "Plan the lift: check the weight, route and where it's going. Team lift long or awkward items such as roof sheets.", "Lift with your legs, keep the load close and don't twist.", "Wear gloves when handling sheets: edges are sharp. Take extra care in wind."]}, {"id": "tools", "t": "Power tools and electrical safety", "p": ["Use 110 V or battery tools on site. Check tools and leads before use and make sure they've been inspected.", "Guards on, the correct disc or blade for the material, and never remove guards.", "Keep leads out of walkways and away from water and sharp edges.", "Wear eye and hearing protection, plus RPE and gloves as the RAMS require.", "Disconnect before changing discs or blades. Never leave a tool running unattended."]}, {"id": "vehicles", "t": "Vehicles and load security", "p": ["Do the daily vehicle check. Report defects and don't drive a vehicle that isn't safe.", "Secure every load. Sheets, ladders and materials must be strapped, not just packed in.", "No handheld phone use while driving. Pull over safely.", "Plan breaks on long drives and watch for fatigue."]}, {"id": "weather", "t": "Weather, heat and cold", "p": ["Check the forecast and wind speed before roof work. Stop when conditions turn.", "In summer: sun protection, water and shade breaks.", "In cold or wet weather, watch for ice, frost and slippery surfaces, and keep warm and dry.", "Anyone can stop work because of the weather. Nobody will be criticised for it."]}, {"id": "ppe", "t": "PPE: what and when", "p": ["PPE is the last line of defence, but it is required on every job.", "Safety boots, hi-vis, hard hat and gloves as standard. Eye, hearing and respiratory protection and harnesses as the RAMS require.", "Check PPE before use and replace anything damaged. Ask the office through the team app.", "RPE only works if it fits. Face-fit test, and do a fit check every time you put it on."]}, {"id": "reporting", "t": "Reporting accidents, incidents and near misses", "p": ["Report every accident, injury and near miss, however small, to the site manager and in the CBS team app.", "Near misses show us where the next injury will come from. Reporting them prevents harm.", "Serious injuries and dangerous occurrences may be reportable to HSE under RIDDOR. Tell the site manager immediately.", "Nobody gets in trouble for reporting. Not reporting is the problem."]}, {"id": "emergency", "t": "First aid and emergencies", "p": ["Know where the first aid kit, fire extinguisher and assembly point are, and who the first aiders are.", "Know the site address and postcode so you can give them to 999.", "Know the nearest A&E for today's job.", "For non-urgent medical advice, call NHS 111. For anything serious, call 999."]}];

var TOPICS=[
{id:'abrasive',t:'Abrasive wheels and cut-off saws',p:['Only trained and authorised people may fit or change abrasive wheels and discs.','Check the disc is right for the tool and the material, undamaged and in date, and that its maximum speed is higher than the tool’s speed.','Use reinforced discs only on handheld machines. Set the guard to expose as little of the disc as possible.','Don’t force the disc, and never grind with the side of a cutting disc.','Wear eye, hearing and respiratory protection. Use water suppression or extraction when cutting masonry or concrete.','Watch where the sparks go. Protect other people and combustibles, and work under a hot works permit where required.','Isolate the tool before changing a disc, and never put it down while the disc is still spinning.','Ask the team: what checks do you make before fitting a new disc?']},
{id:'accidents',t:'Accident prevention',p:['Most accidents come from people not thinking, cutting corners or ignoring their instructions and training.','Never remove guards, barriers or signs, and never use faulty equipment or make improvised repairs.','Only use plant, machines and products you are trained and authorised for. Check the CoSHH assessment before using any product.','Keep the work area tidy: no tools left where they can fall, no trailing leads, clean up as you go.','Never point compressed air at yourself or anyone else, and no horseplay on site.','If you see something unsafe, stop and report it to the site manager. Make it safe if you can do so without risk.','An injury can cost you your income, your hobbies and time with your family. Think about who relies on you.','Ask the team: what would you do if you saw an unsafe condition on this job?']},
{id:'drugs',t:'Alcohol, drugs and medication',p:['Alcohol and drugs slow your reactions and affect judgement, balance and vision. On site that gets people hurt.','Nobody works under the influence. Anyone unfit for work will be stood down, and CBS policy may lead to disciplinary action.','Alcohol takes time to leave your body, roughly one unit an hour. A heavy night can leave you unfit to work or over the drink-drive limit the next morning.','Some prescription and over-the-counter medicines cause drowsiness. Tell your supervisor if you are taking anything that could affect you.','If you are worried about a workmate, tell the site manager. It could save their life.','If you have a problem, talk to us. Confidential help is available, for example FRANK on 0300 123 6600. We would rather help than lose you.','Ask the team: what would you do if a workmate turned up unfit for work?']},
{id:'asbestos',t:'Asbestos awareness',p:['Buildings built or refurbished before 2000 may contain asbestos: roof sheets, cladding, insulation board, pipe lagging, textured coatings, floor tiles and gutters.','Check the client’s asbestos survey before work starts and ask the site manager if you are unsure.','Most at risk are trades who drill, cut or disturb the building fabric: electricians, plumbers, joiners, roofers and maintenance workers.','If you find something you suspect is asbestos: stop, do not disturb it, keep others away and tell the site manager.','Never sweep or vacuum suspect debris with an ordinary vacuum.','Breathing in the fibres causes mesothelioma, lung cancer and asbestosis, often decades later. Smoking makes the risk much higher.','Only a licensed or competent specialist removes asbestos. Everyone needs asbestos awareness training, refreshed every year.','Ask the team: what would you do if you uncovered a suspect material today?']},
{id:'coshh',t:'CoSHH: hazardous substances',p:['Paints, adhesives, solvents, cement, resins, fuels, cleaning chemicals and silica and wood dust can all harm your health.','Before using a product, read the CBS CoSHH assessment and safety data sheet in the job’s CoSHH pack. Follow the controls and PPE they list.','Substances get into the body by breathing them in, swallowing them, skin contact and through cuts.','Never decant into unlabelled containers or drink bottles, and never mix chemicals.','Store products securely and return them at the end of the shift. Don’t store them above head height.','Don’t eat, drink or smoke while handling substances. Wash before breaks and at the end of the shift.','Report any symptoms such as rashes, coughing, headaches or dizziness.','Ask the team: where is the CoSHH assessment for the products we are using today?']},
{id:'grp',t:'Cutting GRP grating for service penetrations',p:['Follow the RAMS and the manufacturer’s specification. Never cut or move perimeter or internal supports without approval, and report any clash between services and supports.','Set up an exclusion zone with barriers and signs on the working level and on the levels above and below.','PPE: standard site PPE plus face-fit tested FFP3 RPE, eye and hearing protection, and covered arms (GRP dust irritates skin). The CoSHH assessment and SDS are in the RAMS.','Check the dimensions and mark out. Keep cut-outs tight to the services, allowing for lagging, and leave at least one full square (two structural bars) between penetrations.','Cut with a jigsaw and a carbide or diamond GRP blade, with on-tool dust extraction.','Support the cut-out before the final cut so nothing drops to the level below. Remove large cut-outs in smaller pieces.','Large openings are cut by a harness-trained operative in fall restraint, attached to a tested anchor point. Protect the opening straight away.','Bag GRP offcuts and dust immediately and dispose of them correctly.','Ask the team: what do you do if a service clashes with a support?']},
{id:'dust',t:'Dust and silica',p:['Cutting, drilling and grinding concrete, brick, block or stone creates silica dust, which causes lung disease.','Use on-tool extraction (M or H class) or water suppression every time.','Wear face-fit tested RPE (FFP3 as a minimum for silica). Be clean-shaven where the mask seals.','Never dry sweep or blow dust with compressed air. Use an H-class vacuum.','Keep the client’s areas, especially food production areas, sealed off from dust.']},
{id:'eyes',t:'Eye protection',p:['Common eye injuries come from flying chips when breaking out or chiselling, grinding sparks, dust, chemical splashes and UV from welding.','Wear eye protection whenever the RAMS or signs require it, and always when grinding, cutting, drilling overhead, breaking out or using compressed air or chemicals.','Make sure it fits, is the right type for the job and works with your other PPE.','Keep it clean, and replace it straight away if it is scratched, damaged or lost.','Eye protection goes over your eyes, not on your hard hat or round your neck.','If something gets in your eye, don’t rub it. Use the eyewash and get a first aider. Get medical help for chemical splashes or anything embedded.','Ask the team: which tasks today need eye protection?']},
{id:'fire',t:'Fire prevention and action on fire',p:['Keep waste, rags and packaging cleared away. Don’t let combustible material build up.','Store flammable liquids and gas in sealed, labelled containers, away from heat and ignition sources, and outside where possible.','No smoking or vaping except in designated areas. Don’t overload sockets or daisy-chain extension leads.','Hot works only go ahead under a permit (see Hot works and fire risk).','Know the alarm, your escape route and the assembly point. Keep fire exits and extinguishers clear.','Extinguishers: water for wood and paper, foam for wood, paper and flammable liquids, CO2 for electrical equipment and flammable liquids, dry powder for most fires but avoid using it indoors.','On fire: raise the alarm, call 999 and evacuate. Only tackle a small fire if you are trained, it is safe and you have a clear way out behind you. Never use water on electrical fires.','Ask the team: where is the assembly point and nearest extinguisher on this job?']},
{id:'emergency',t:'First aid and emergencies',p:['Know where the first aid kit, fire extinguisher and assembly point are, and who the first aiders are.','Know the site address and postcode so you can give them to 999.','Know the nearest A&E for today’s job.','If you find a casualty: make sure it is safe for you, call the first aider and 999 if needed, and don’t move them unless they are in danger.','Stay with them, reassure them and keep them warm. Don’t give them food or drink.','Every van carries a travel first aid kit. Tell the office when supplies run low.','For non-urgent medical advice, call NHS 111. For anything serious, call 999.','Ask the team: who is the first aider on site today?']},
{id:'general',t:'General site health and safety',p:['Under the Health and Safety at Work Act 1974 you must look after yourself and anyone affected by what you do or fail to do.','Follow the site rules, RAMS and instructions. Never do dangerous work or operate machines you are not trained for.','Look after your PPE and report any fault or defect that could put someone at risk.','Clean up as you go: offcuts, nails in timber and rubbish cause trips, cuts and fires.','Keep gangways, stairs and fire exits clear. Route leads and hoses out of the way, overhead where possible.','Secure loose items when working at height so nothing can fall.','Store fuel, gas, foam and other flammables safely, away from fire exits and ignition sources.','Ask the team: what do this site’s rules cover (PPE, vehicles, fire, permits)?']},
{id:'vibration',t:'Hand-arm vibration (HAVS)',p:['Breakers, grinders, SDS drills, saws and compactors cause hand-arm vibration.','Early signs are tingling, numbness or white fingers, especially in the cold. The damage can become permanent.','Use low-vibration tools and stay within the trigger-time limits on the tool and in the RAMS.','Keep tools maintained and bits sharp. Let the tool do the work and don’t grip harder than you need to.','Keep your hands warm and dry, take breaks and rotate tasks.','Report symptoms to your supervisor early. Health surveillance is there to catch problems before they get worse.','Ask the team: which tools do you use that vibrate, and for how long?']},
{id:'hardhats',t:'Hard hats and head protection',p:['Wear your hard hat whenever the site rules require it, adjusted to fit and worn peak to the front.','Use the chin strap when working at height, bending over or in wind.','Check the shell and harness before use. Replace it if it is cracked, brittle or faded, after any impact even with no visible damage, or when it reaches the manufacturer’s replacement date.','Don’t paint it, drill it or use solvents or adhesives on it (approved labels only), and don’t leave it on a van dashboard in the sun.','Don’t wear hoods or caps under it. In cold weather use a purpose-made helmet liner or balaclava that doesn’t block your vision or hearing.','A bump cap is not a substitute where a hard hat is required.','Ask the team: how do you check whether your hard hat is still in date?']},
{id:'health',t:'Health on site',p:['More construction workers die from work-related ill health than from accidents: dust, asbestos, noise, vibration and skin disease.','Control dust at source and wear the right RPE (see Dust and silica).','Wear hearing protection in noisy areas and around loud tools. Hearing loss is permanent.','Protect your skin from substances and the sun.','Eat well, drink plenty of water and get proper rest. Fatigue causes mistakes.','Mental health matters. If you are struggling, talk to the site manager or someone you trust. The Lighthouse Construction Industry Charity helpline is 0345 605 1956.','Ask the team: what could you do to protect your own health on this job?']},
{id:'hotworks',t:'Hot works and fire risk',p:['Grinding, cutting and welding throw sparks that can start fires hours later.','Hot works only go ahead under a CBS hot works permit, with the client’s approval where required.','Clear or protect combustibles, check what is behind and below the work, and keep a suitable extinguisher at hand.','Keep a fire watch during the work and for at least 60 minutes afterwards, then check the area again before leaving.']},
{id:'hse',t:'HSE inspectors and their powers',p:['HSE inspectors can visit any site without notice and carry an official warrant card.','They can enter, inspect, take photos, measurements and samples, copy documents, require areas to be left undisturbed and interview people or take statements.','They can serve improvement notices, prohibition notices that stop work immediately, and prosecute companies and individuals, including employees.','If an inspector arrives, be polite, take them to the site manager and let the office know.','Answer honestly. It is an offence to obstruct an inspector, give false information or stop someone else from speaking to them.','Following the RAMS and keeping our records up to date is the best preparation for any visit.','Ask the team: do you think an employee can be prosecuted, or only the company?']},
{id:'ladders',t:'Ladders and stepladders',p:['Use ladders only for short-duration, light work (minutes, not hours) where a platform or MEWP isn’t practicable.','Do a pre-use check: feet, rungs, stiles and locks. Use Class 1 or EN 131 professional ladders only.','Never use painted or repaired ladders. Label damaged ladders do not use, report them and remove them from site.','Set leaning ladders at about 1 out for every 4 up, on firm level ground, extending 1 m above the landing point.','Tie the ladder or have it footed. Keep three points of contact and don’t overreach. Move the ladder instead.','Face the ladder, keep your boots clean and your hands free. Don’t carry heavy or awkward items up a ladder; use a hoist or lifting equipment.','Extension ladders: follow the manufacturer’s minimum overlap between sections.','Keep metal ladders well away from overhead power lines and live electrics.']},
{id:'lead',t:'Lead',p:['Lead is a poison. It can cause headaches, tiredness and stomach pain, and longer-term damage to the kidneys, nerves, brain and fertility.','Highest risk work: burning off or sanding old lead paint, hot cutting, disc cutting lead and demolishing old painted structures.','Handling clean sheet lead and soldering is lower risk but still needs good hygiene.','Use the controls in the RAMS: extraction, wet methods and the right RPE.','Wash your hands and face before eating, drinking or smoking, and never eat in the work area. Keep work clothes separate from home clothes.','Anyone who is pregnant or breastfeeding must tell their supervisor before any lead work.','Regular lead work may need medical surveillance, including blood tests.','Ask the team: which tasks on this job could expose us to lead?']},
{id:'liftequip',t:'Lifting operations and equipment (LOLER)',p:['Every lift is planned by a competent person. Complex lifts need a written lift plan.','All lifting equipment and accessories must be marked with their safe working load (SWL) and have an in-date thorough examination: every 6 months for accessories and equipment that lifts people, every 12 months for other lifting equipment.','Never exceed the SWL. Only trained operators use lifting equipment.','Do the pre-use check, and look out for overhead obstructions and power lines.','Nobody stands under a suspended load. Lifts are directed by a trained slinger/signaller.','Telehandlers and forklifts: travel with the load low, no passengers, and never lift people without an approved work platform.','Cranes: lift and lower vertically, never drag loads, use tag lines and stop in high wind.','Ask the team: where do you find the SWL and examination date on this equipment?']},
{id:'lifting',t:'Manual handling',p:['Avoid manual handling where you can by using the telehandler, trolleys or other aids.','Plan the lift: check the weight, route and where it’s going. Team lift long or awkward items such as roof sheets.','Lift with your legs, keep the load close and don’t twist.','Wear gloves when handling sheets: edges are sharp. Take extra care in wind.']},
{id:'mewp',t:'MEWPs and telehandlers',p:['Only trained, carded operators (IPAF or CPCS/NPORS) may operate a MEWP or telehandler.','Do the pre-use check and check the thorough examination (LOLER) is in date.','Check the ground conditions, overhead hazards and the exclusion zone before setting up.','Wear a harness with a short restraint lanyard in boom-type MEWPs, clipped to the designated anchor.','A trained ground rescue person stays at ground level while the MEWP is in use and knows how to use the ground controls.','A banksman controls every telehandler movement near people or in the client’s yard.']},
{id:'plant',t:'Plant and equipment',p:['Only trained and authorised operators use plant. Carry your card.','Do the pre-use check (brakes, lights, tyres, fluids, guards and alarms). Report defects and don’t use defective plant.','Wear the seatbelt where fitted. No passengers unless there is a proper seat.','Follow site speed limits, routes and one-way systems. Use a banksman when reversing or working near people.','Rear-steer and articulated plant swings wide when turning. Keep clear of the danger zone.','Static plant: brakes on or wheels chocked, guards in place, barriers where needed, exhaust fumes vented and supply leads protected.','Switch off and remove the keys when plant is left unattended.','Ask the team: where is the danger zone around the plant on this job?']},
{id:'pollution',t:'Pollution and environmental control',p:['Our work can pollute the air, ground and water through dust, fumes, fuel, oil, concrete washout and noise.','Store fuel and oils in bunded containers or on drip trays, away from drains and watercourses.','Know where the spill kit is and how to use it. Report every spill to the site manager straight away.','Never wash concrete, paint or chemicals into drains.','Switch off engines when not in use, and don’t run engine-driven plant indoors or in enclosed spaces.','Keep plant serviced to stop leaks and put drip trays under static plant.','Keep noise and dust down, especially on live client and food sites.','Ask the team: what on this job could cause pollution, and how do we stop it?']},
{id:'tools',t:'Power tools and electrical safety',p:['Use 110 V or battery tools on site. Check casings, leads, plugs and switches before use and make sure the tool has been inspected.','Don’t use a damaged tool. Label it, take it out of use and report it.','Guards on, the correct disc, bit or blade for the material, and never remove guards. Don’t use blunt or damaged bits.','Keep leads out of walkways and away from water and sharp edges.','Never plug a tool into a lighting socket. A tool that has got wet must be checked by a competent person before use.','Wear eye and hearing protection, plus RPE and gloves as the RAMS require.','Disconnect before changing discs or blades. Never leave a tool running unattended.']},
{id:'ppe',t:'PPE: what and when',p:['PPE is the last line of defence, but it is required on every job.','Safety boots, hi-vis, hard hat and gloves as standard. Eye, hearing and respiratory protection and harnesses as the RAMS require.','CBS provides your PPE free of charge and replaces it when it is worn, damaged or lost.','Check PPE before use and replace anything damaged. Ask the office through the team app.','Don’t modify PPE (cutting fingers off gloves, cutting down hi-vis) and check it is marked to the right standard (UKCA or CE).','Make sure items work together, for example safety glasses with your RPE and ear defenders with your hard hat.','RPE only works if it fits. Face-fit test, and do a fit check every time you put it on.']},
{id:'reporting',t:'Reporting and investigating accidents, incidents and near misses',p:['Report every accident, injury and near miss, however small, to the site manager and in the CBS team app.','A record protects you: if an injury causes problems later, it shows what happened.','Near misses show us where the next injury will come from. Reporting them prevents harm.','Accidents to members of the public caused by our work must be reported too.','Serious injuries, injuries keeping someone off work for more than 7 days and dangerous occurrences may be reportable to HSE under RIDDOR. Tell the site manager immediately.','CBS investigates to find the cause and stop it happening again, not to blame. If you are asked about an accident, stay calm, say honestly what you saw and say if you don’t know.','Nobody gets in trouble for reporting. Not reporting is the problem.','Ask the team: what would you do if you witnessed an accident?']},
{id:'roofs',t:'Roof work, fragile surfaces and edge protection',p:['Any fall from height can kill. Roof access is planned and set out in the RAMS before anyone goes up.','Check the edge protection, netting and access points are in place and inspected before you start.','Treat every rooflight and any unknown roof sheet as fragile. Never step on them; use crawling boards or stay on the designated walkways.','Remove sheets in small, controlled sections so the roof stays stable, and report any damaged purlins or fixings straight away.','Keep an exclusion zone below the work and tether tools so nothing falls on people below.','Stop work in high wind (above 23 mph), rain, ice or poor light. Nobody works on a roof alone.']},
{id:'inspections',t:'Safety inspections and consultation',p:['CBS carries out site inspections to find and fix problems before they hurt someone.','Scaffolds, towers, excavations and lifting equipment have their own required inspections. Check the tag or record before use.','The daily pre-start check is part of every job.','You have a right to be consulted on health and safety. Raise concerns with the site manager or through the CBS team app.','If an inspection finds a problem, it is logged as an action and closed out.','Ask the team: what would you change on this site to make it safer?']},
{id:'scaffold',t:'Scaffolds and system scaffolds',p:['Only competent scaffolders erect, alter or dismantle scaffold. Never remove ties, boards or guardrails yourself, even on system scaffold where it is easy to do.','Check the scaffold tag and inspection record before use. Scaffolds are inspected after erection, at least every 7 days, and after bad weather or any alteration.','If something has been changed or looks wrong, don’t use it. Report it.','Don’t overload platforms. Land heavy loads in loading bays and spread materials out.','Keep platforms clear and use the proper access, never the cross braces.','If a scaffold seems unstable, get off safely and tell the site manager.','Ask the team: what would you do if a guardrail is in your way?']},
{id:'security',t:'Site security and the public',p:['Children and trespassers are drawn to sites, and we have a legal duty to protect them even when they shouldn’t be there.','Check fencing, hoarding and gates are intact and locked at the end of each day.','Remove or board off ladders, isolate plant and take the keys, and cover or fence excavations.','Lock away tools, materials and hazardous substances out of sight.','Politely ask anyone you don’t recognise who they are there to see, and take them to the site manager. Don’t get into confrontations.','Visitors must sign in. Report thefts, damage or break-ins straight away.','Ask the team: what needs securing on this job before we leave today?']},
{id:'skin',t:'Skin protection and dermatitis',p:['Cement, epoxy resins, solvents, oils, bitumen and some timbers cause dermatitis and burns, and some can cause skin cancer.','Wet cement is strongly alkaline and can cause serious burns. Wash it off straight away and don’t kneel in it.','Wear the right gloves for the substance (check the CoSHH assessment). Change them when they are damaged or wet inside.','Wash with soap and water, dry thoroughly and use after-work cream. Never clean skin with solvents, thinners or abrasives.','Don’t let resins or glues dry on your skin, don’t keep oily rags in your pockets, and change contaminated clothing.','Check your skin regularly and report rashes, cracking, itching or warts early.','Ask the team: which products on this job could affect your skin?']},
{id:'slinging',t:'Slingers and signallers',p:['Only trained, competent slinger/signallers sling loads and direct lifts, following the lift plan.','Check lifting accessories before every use: SWL marked, in-date examination, no cuts, kinks or damage. Take anything defective out of use.','Know the weight of the load. Use hooks with safety catches and the correct shackle pins, fully tightened.','Protect slings from sharp edges with packing. Never knot chains or slings to shorten them, and never use lifting gear for towing.','Keep the operator in sight or use radios charged and checked at the start of the shift. Give clear, standard signals.','Take the strain and check the load is free and balanced before lifting. Use tag lines. Nobody under the load and nobody rides on a load.','Land loads on bearers to protect the slings, and keep everyone not involved out of the lifting zone.','Ask the team: what do you check on a sling before use?']},
{id:'stacking',t:'Storing and stacking materials',p:['Only stack in agreed areas, never in doorways, walkways or fire routes.','Stack on a firm, level base using bearers and packing.','Keep stacks stable: as a rule no higher than three times the base width. Pallets of bricks or blocks no more than two high, loaded squarely.','Don’t stack anything on packs with damaged banding or displaced materials.','Timber on bearers or in racks, with different lengths kept separate.','Panels and sheets flat or in racks, never leaned against temporary works or where wind can catch them.','Chock pipes and don’t stack them in pyramids. Lay large concrete rings flat so they can’t roll.','Plan the order materials will be used and stack close to the work to cut down handling.']},
{id:'sun',t:'Sun safety',p:['Outdoor workers get a lot of UV exposure. Skin cancer is one of the most common cancers in the UK and most cases are preventable.','You can burn in as little as 10 minutes in strong sun, even on cloudy days.','Keep your top on and wear a brim or neck flap with your hard hat.','Use SPF 30 or higher sunscreen with at least a 4-star UVA rating on exposed skin, and reapply it during the day.','Take breaks in the shade, especially between 11am and 3pm, and drink plenty of water.','Fair skin, freckles, lots of moles or a family history means a higher risk, but all skin types can be damaged.','See your GP about any mole or patch that changes shape, colour or size, or itches, weeps or bleeds.']},
{id:'services',t:'Underground and overhead services',p:['Before breaking ground, check the service drawings (power, gas, water, telecoms), then scan with a CAT and Genny used by someone trained.','Treat every cable and pipe as live until it has been confirmed dead.','Hand dig trial holes to find the exact position, and look for marker tape, tiles or covers.','Take care breaking out concrete: services can sit just below the surface.','If you strike a service: stop, keep everyone clear, don’t touch it and tell the site manager so the network operator can be called.','Replace marker tape or tiles when backfilling.','Treat all overhead lines as live. Keep plant, ladders, towers and scaffold tubes well clear, respect goal posts and barriers, and never stack materials or tip under lines.','Ask the team: what checks are done before we dig today?']},
{id:'vehicles',t:'Vehicles and load security',p:['Do the daily vehicle check. Report defects and don’t drive a vehicle that isn’t safe.','Secure every load. Sheets, ladders and materials must be strapped, not just packed in.','No handheld phone use while driving. Pull over safely.','Plan breaks on long drives and watch for fatigue.']},
{id:'waste',t:'Waste and housekeeping',p:['Separate waste into the right skips or bags. Hazardous waste (substance containers, aerosols, gas bottles, asbestos) never goes in general waste.','Remove or flatten nails in scrap timber.','Bag or bundle light waste so it can’t blow away. Lower waste from height by chute or hoist, never throw it.','Don’t fill skips above the sides. A skip on the road needs a council permit, cones and lights at night.','Never burn waste or light fires in skips.','Put food waste in lidded bins. Rats spread Weil’s disease.','Waste only goes to licensed carriers, with a waste transfer note.','Ask the team: where do substance containers go on this job?']},
{id:'weather',t:'Weather, heat and cold',p:['Check the forecast and wind speed before roof work. Stop when conditions turn.','In summer: sun protection, water and shade breaks.','In cold or wet weather, watch for ice, frost and slippery surfaces, and keep warm and dry.','Anyone can stop work because of the weather. Nobody will be criticised for it.']},
{id:'benefits',t:'Why safety matters',p:['Most accidents are preventable. They usually come from shortcuts or people knowingly working unsafely.','An accident costs the injured person (pain, lost income), their family, and the person who caused it, who has to live with it.','For CBS it means investigations, fines, higher insurance and lost work. Our clients expect high standards.','Never cut corners to save time. If you are asked to do something unsafe or something you are not trained for, stop and ask.','Don’t come to work unfit through illness, drink or drugs.','Challenge or report unsafe behaviour and horseplay.','Safe sites run better: less disruption, fewer stoppages and better morale.','Ask the team: who is responsible for your safety?']},
{id:'height',t:'Working at height',p:['Falls from height are the biggest cause of deaths in construction. There is no safe height to fall from.','Avoid working at height where you can. If not, use a platform with guardrails or a MEWP before anything that only limits a fall.','Edge protection needs a main guardrail at least 950 mm high, an intermediate rail and toe boards wherever someone could fall.','Identify fragile surfaces, openings and rooflights before anyone goes up. Cover or guard openings and replace covers straight away.','Check towers, scaffolds and access equipment are inspected and tagged before use.','Secure tools and materials. Lower waste by chute or hoist, never throw it.','Stop work in high wind, rain, ice or poor light.','Ask the team: how is a fall prevented on today’s task?']},
{id:'water',t:'Working near or over water',p:['Work near or over water only goes ahead with a specific RAMS and rescue plan.','Wear a life jacket where there is a risk of falling in. An auto-inflating life jacket turns an unconscious person face up; a buoyancy aid doesn’t.','Edge protection, secured boards and tied ladders. Keep walkways clear and non-slip, and stow tools and materials.','Never work alone near water. Check rescue equipment (throw lines, life rings, safety boat) at the start of every shift.','Cold water shock can kill in minutes, even strong swimmers.','Leptospirosis (Weil’s disease): cover cuts, wash your hands, and if you get flu-like symptoms tell your GP you have worked near water.','Ask the team: what rescue equipment is on this job and who checks it?']},
{id:'livesite',t:'Working on live client sites and food factories',p:['We work in live premises. Follow the client’s site rules, sign in and out, and stay within the segregated work area.','Food sites: no food, drink, glass or loose items in production areas, follow the client’s hygiene and PPE rules, and report any foreign body risk.','Keep barriers, signage and segregation in place at all times. Never use the client’s equipment without permission.','Keep vehicle movements to agreed times and routes, with a banksman in the client’s yard.','Leave nothing behind: no debris, fixings, packaging or tools at height or on the client’s premises at the end of the shift.']},
{id:'young',t:'Young and new workers',p:['A young person is anyone under 18. New starters of any age face many of the same risks.','They may not recognise dangers, may be keen to please and may not speak up.','Every young person has a specific risk assessment and closer supervision. Some tasks and plant are off-limits.','Make sure they have had a site induction, however short their time on site.','Look out for them: stop anything unsafe and explain why. Encourage them to ask questions.','No horseplay or pranks.','Ask the team: what would you do if you saw a new starter in danger?']}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function nl(s){return esc(s).replace(/\n/g,"<br>");}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function nz(s){if(!s)return "";var d=new Date(String(s).slice(0,10)+"T00:00:00");if(isNaN(d.getTime()))return String(s);return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();}
function daysTo(s){if(!s)return null;var d=new Date(String(s).slice(0,10)+"T00:00:00");if(isNaN(d.getTime()))return null;var t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5);}

function opt(v,sel,label){return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?" selected":"")+">"+esc(label==null?v:label)+"</option>";}
function workerOpts(sel,blankLabel){var h=opt("",sel,blankLabel||"Choose");var names=W.map(function(w){return w.name;});if(sel&&names.indexOf(sel)<0)h+=opt(sel,sel);names.forEach(function(n){h+=opt(n,sel);});return h;}
function field(label,html,wide){return '<label class="f'+(wide?" w":"")+'"><span>'+label+"</span>"+html+"</label>";}
function inp(path,type,ph){return '<input type="'+(type||"text")+'" data-b="'+path+'" value="'+esc(get(path))+'"'+(ph?' placeholder="'+esc(ph)+'"':"")+">";}
function area(path,rows,ph){return '<textarea rows="'+(rows||3)+'" data-b="'+path+'"'+(ph?' placeholder="'+esc(ph)+'"':"")+">"+esc(get(path))+"</textarea>";}
function get(path){var o=state;path.split(".").forEach(function(k){o=o==null?"":o[k];});return o==null?"":o;}
function set(path,v){var ks=path.split("."),o=state;for(var i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}
function card(title,body,sub){return '<div class="card"><h3>'+title+(sub?' <small>'+sub+"</small>":"")+"</h3>"+body+"</div>";}
function actionsCard(key,title){var h="";state[key].forEach(function(a,i){
h+='<div class="rowbox"><div class="g3">'+field("Action",'<input data-b="'+key+"."+i+'.what" value="'+esc(a.what)+'">',1)
+field("Who",'<select data-b="'+key+"."+i+'.who">'+workerOpts(a.who,"Choose")+"</select>")
+field("By",'<input type="date" data-b="'+key+"."+i+'.due" value="'+esc(a.due)+'">')+'</div><button class="x" data-del="'+key+"."+i+'">Remove</button></div>';});
return card(title,h+'<button class="s" data-add="'+key+'">+ Add action</button>');}
